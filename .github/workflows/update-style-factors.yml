name: 每日更新风格因子（股票/债券/大宗商品）

# 修复：大宗商品信号长期不更新
# 根因：build_style_factors.py 此前没有任何 cron / CI 调度，只能手动运行，
# 导致 style_factors(category='commodity') 一直停在最后一次手动跑的结果（看似“很久没更新”）。
# 本流水线每日定时重算全部三类风格因子（股票/债券/大宗商品），写入 style_factors 表，
# 前端「大宗商品信号」即可读到最新 updated_at 与最新分位。
# 注意：本流水线只更新数据库，前端从 Supabase 实时读取，无需重新部署。

on:
  # 统一调度（2026-11-28）：独立 schedule 停用，改由 data-center-orchestrator.yml 串行触发。
  # schedule:
  #   - cron: '10 16 * * *'   # 原北京时间每天 00:10
  workflow_call:
    inputs:
      from_orchestrator:
        description: '仅由调度中心调用时置 true；手动/远程触发自动转交调度中心排队，本 workflow 不直接写生产'
        type: boolean
        default: false
  # 手动触发
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 手动/远程触发不直接写生产：自动转交调度中心，按 needs 优先次序排队执行。
  # 调度中心回调本 workflow 时 from_orchestrator=true，本 job 自动跳过，避免循环。
  delegate-to-orchestrator:
    if: ${{ !inputs.from_orchestrator }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 转交调度中心排队
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TASK: style-factors
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/data-center-orchestrator.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"only_task\":\"${TASK}\"}}")
          if [ "$status" != "204" ]; then echo "转交调度中心失败：HTTP $status"; exit 1; fi
          echo "已转交调度中心：only_task=${TASK}，将按 needs 优先次序排队执行（本 workflow 不直接写生产）"

  update:
    if: ${{ inputs.from_orchestrator }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_PAT: ${{ secrets.SUPABASE_MGMT_TOKEN }}
      SUPABASE_MGMT_TOKEN: ${{ secrets.SUPABASE_MGMT_TOKEN }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install akshare requests

      - name: 校验环境变量
        run: |
          if [ -z "$SUPABASE_PAT" ]; then
            echo "ERROR: 未配置 secrets.SUPABASE_MGMT_TOKEN"
            exit 1
          fi
          echo "SUPABASE_PAT 已配置: ${#SUPABASE_PAT} 字符"

      - name: 步骤1 — 抓取计算并写入中间表 style_factors_staging（不碰生产）
        run: python scripts/build_style_factors.py --to-staging

      - name: 步骤2 — 校验中间表并单事务原子切换生产 style_factors
        run: python scripts/build_style_factors.py --promote
