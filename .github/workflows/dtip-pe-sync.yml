name: 定投助手PE历史夜间同步

on:
  # 统一调度（2026-11-28）：独立 schedule 停用，改由 data-center-orchestrator.yml 串行触发。
  # schedule:
  #   - cron: '0 18 * * *'   # 原北京 02:00
  workflow_call:
  workflow_dispatch:
  repository_dispatch:
    types: [dtip-pe-sync]

permissions:
  contents: read

env:
  SUPABASE_PAT: ${{ secrets.SUPABASE_MGMT_TOKEN }}
  SUPABASE_MGMT_TOKEN: ${{ secrets.SUPABASE_MGMT_TOKEN }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 同步 PE 历史到缓存表 dtip_pe_history
        run: python scripts/dtip_pe_sync.py
