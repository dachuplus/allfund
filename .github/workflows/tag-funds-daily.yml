name: 热门标签关联基金每日同步

# 2026-11-14：fund_tag_funds 曾自 2026-07-13 起 4 个月未更新（上游「高端制造」
# 板块已有 2687 只、库内仅 1008 只），且页面没有任何数据时间提示。此工作流
# 每日重拉一次，配合热门页显示的「标签数据时间」与过期红字提示形成闭环。
#
# 2026-11-14 架构改造（按用户要求）：抓取全程只写中间表
# public.fund_tag_funds_staging，全部拉完并校验通过后由数据库函数
# public.apply_fund_tag_funds(true) 在单个事务内统一落地正式表、
# fund_scores.tags / has_concept / has_industry 与物化视图；函数起始的
# pg_advisory_xact_lock 与评分流水线 promote_staging.py [2.5]（调用同一函数）
# 串行化写入。因此【数据一致性不再依赖调度时间错开】，即使两条流水线同时跑
# 也不会互相清空。UTC 21:00 = 北京 05:00 只是避开 21:30 评分流水线高峰、
# 减少锁等待的调度偏好，可随时调整。

on:
  # 统一调度（2026-11-28）：独立 schedule 停用，改由 data-center-orchestrator.yml 串行触发。
  # schedule:
  #   - cron: '0 21 * * *'   # 原北京时间 05:00
  workflow_call:
    inputs:
      from_orchestrator:
        description: '仅由调度中心调用时置 true；手动/远程触发自动转交调度中心排队，本 workflow 不直接写生产'
        type: boolean
        default: false
  workflow_dispatch:

jobs:
  # 手动/远程触发不直接写生产：自动转交调度中心，按 needs 优先次序排队执行。
  # 调度中心回调本 workflow 时 from_orchestrator=true，本 job 自动跳过，避免循环。
  delegate-to-orchestrator:
    if: ${{ !inputs.from_orchestrator }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 转交调度中心排队
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TASK: tag-funds
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/data-center-orchestrator.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"only_task\":\"${TASK}\"}}")
          if [ "$status" != "204" ]; then echo "转交调度中心失败：HTTP $status"; exit 1; fi
          echo "已转交调度中心：only_task=${TASK}，将按 needs 优先次序排队执行（本 workflow 不直接写生产）"

  sync:
    if: ${{ inputs.from_orchestrator }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install requests
      - name: 全量重拉标签-基金映射（中间表 → 校验 → 单事务统一落地）
        env:
          SUPABASE_MGMT_TOKEN: ${{ secrets.SUPABASE_MGMT_TOKEN }}
        run: python scripts/tag_sync_daily.py
