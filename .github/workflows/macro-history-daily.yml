name: 宏观历史日更

on:
  # 独立 schedule 已停用（2026-11-28）：统一由调度中心 data-center-orchestrator.yml 串行调用。
  # schedule:
  #   - cron: '40 17 * * *'
  workflow_call:
    inputs:
      from_orchestrator:
        description: '仅由调度中心调用时置 true；手动/远程触发自动转交调度中心排队，本 workflow 不直接写生产'
        type: boolean
        default: false
      skip_fetch:
        description: '跳过抓取，仅校验并 promote 已有 staging'
        type: boolean
        default: false
      skip_run:
        description: '非执行日跳过真实写库（调度中心日期门控用）'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: '跳过抓取，仅校验并 promote 已有 staging'
        type: boolean
        default: false

jobs:
  # 手动/远程触发不直接写生产：自动转交调度中心，按 needs 优先次序排队执行。
  # 调度中心回调本 workflow 时 from_orchestrator=true，本 job 自动跳过，避免循环。
  delegate-to-orchestrator:
    if: ${{ !inputs.from_orchestrator }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 转交调度中心排队
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TASK: macro-history
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/data-center-orchestrator.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"only_task\":\"${TASK}\"}}")
          if [ "$status" != "204" ]; then echo "转交调度中心失败：HTTP $status"; exit 1; fi
          echo "已转交调度中心：only_task=${TASK}，将按 needs 优先次序排队执行（本 workflow 不直接写生产）"

  refresh:
    if: ${{ inputs.from_orchestrator }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_PAT: ${{ secrets.SUPABASE_MGMT_TOKEN }}
      SUPABASE_MGMT_TOKEN: ${{ secrets.SUPABASE_MGMT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 新版 akshare 已移除本项目使用的旧接口，必须固定版本
          python -m pip install 'akshare==1.20.1'

      - name: Check credentials
        run: |
          if [ -z "$SUPABASE_MGMT_TOKEN" ]; then
            echo "ERROR: SUPABASE_MGMT_TOKEN 未配置"
            exit 1
          fi
          echo "SUPABASE_MGMT_TOKEN 已配置: ${#SUPABASE_MGMT_TOKEN} 字符"

      - name: Step 1 - Fetch into staging table
        if: ${{ !inputs.skip_run && (github.event_name != 'workflow_dispatch' || !inputs.skip_fetch) }}
        run: python3 scripts/refresh_macro_history.py --to-staging

      - name: Step 2 - Validate and promote to production
        if: ${{ !inputs.skip_run }}
        run: python3 scripts/refresh_macro_history.py --promote

      - name: Step 3 - Show production status
        run: python3 scripts/refresh_macro_history.py --status
