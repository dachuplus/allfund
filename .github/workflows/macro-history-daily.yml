name: 宏观历史日更

on:
  schedule:
    # 北京时间每天 10:00（UTC 02:00），避开 00:10 风格因子与 21:30 评分流水线
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_PAT: ${{ secrets.SUPABASE_MGMT_TOKEN }}
      SUPABASE_MGMT_TOKEN: ${{ secrets.SUPABASE_MGMT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 新版 akshare 已移除本项目使用的旧接口，必须固定版本
          python -m pip install 'akshare==1.20.1'

      - name: Check credentials
        run: |
          if [ -z "$SUPABASE_MGMT_TOKEN" ]; then
            echo "ERROR: SUPABASE_MGMT_TOKEN 未配置"
            exit 1
          fi
          echo "SUPABASE_MGMT_TOKEN 已配置: ${#SUPABASE_MGMT_TOKEN} 字符"

      - name: Step 1 - Fetch into staging table
        run: python3 scripts/refresh_macro_history.py --to-staging

      - name: Step 2 - Validate and promote to production
        run: python3 scripts/refresh_macro_history.py --promote

      - name: Step 3 - Show production status
        run: python3 scripts/refresh_macro_history.py --status
