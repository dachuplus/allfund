name: 指数评分每日更新

# 指数「靠谱指数」五维评分每日刷新（选品·指数 Tab）。
#
# 与既有流水线错峰，避开各自cron：
#   21:30 基金评分 / 21:45 标签资金流 / 22:30 配置季度 / 23:20 股票评分 / 00:10 风格因子
#   本workflow 北京时间 00:40（UTC 16:40）—— 放在最后，因为指数数据是日频、越晚越新鲜。
#
# ⚠️ 数据源（2026-10-10 改写后）：原 csindex（中证官网）在云 CI IP 上被 WAF 403 拦截
#    （首次请求即拦，本地非云 IP 才通），导致 index_scores 长期卡在 10/8。
#    现已改用云可达的免费源（用户确认「用东财的数据接口」）：
#      - 成分股列表：EastMoney datacenter-web RPT_INDEX_CONSTITUENT（按 INDEX_CODE 裸6位，云可达）
#      - 成分股权重 / 指数级 PE：内部 stock_scores（mktcap 推导权重、Σmktcap/Σ(mktcap/pe_ttm) 算指数PE）
#      - 指数收盘/日期：腾讯 gtimg（展示用，不可达时回退 EastMoney CM_CLOSE）
#      - 估值分位：同池横截面 PE 分位（用真实指数PE，免5年历史），彻底去 csindex 依赖
#   因此 CI 跑本 workflow 不再被 WAF 拦，单次全量抓取即可（约 3-5 分钟），无需多轮冷却。
#   若 EastMoney 整体不可达（极少见），fetch 会写 /tmp/WAF_BLOCKED.flag，promote 护栏保旧数据。
#
# 安全性（三级流水线，与 fund/stock 一致）：
#   步骤1 fetch_index_raw.py   → 只写 index_scores_raw（原始落地，不算分）
#   步骤2 compute_index_scores.py → 只写 index_scores_staging（算五维+分池）
#   步骤3 promote_index_scores.py  → 护栏校验不过就**拒绝切换**，生产表保持不变
#   护栏：条数≥60 / k_all非空≥80% / PE分位非空≥90% / broad与sector 各≥3 有分 /
#        成分匹配率≥0.85 / 行情日≤7天；固收池天然稀少，改为非阻断+ 页面提示。
#   所以抓取失败**不会污染线上**，最坏情况是数据停在昨天的版本。

on:
  schedule:
    - cron: '40 16 * * *'   # 北京时间每日 00:40
  workflow_dispatch:
    inputs:
      limit:
        description: '调试用：本次最多抓多少只（0=全部 universe）'
        required: false
        type: string
        default: '0'
      interval:
        description: '每只间隔秒（EastMoney 轻量，0.35 即可；留余量防偶发限流'
        required: false
        type: string
        default: '0.35'

env:
  PYTHONUNBUFFERED: '1'

jobs:
  update-index-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # secret 映射：仓库里确定存在的是 SUPABASE_MGMT_TOKEN；
    # 两个都注入（同一值），脚本的 `SUPABASE_PAT or SUPABASE_MGMT_TOKEN` 都能工作。
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PAT: ${{ secrets.SUPABASE_MGMT_TOKEN }}
      SUPABASE_MGMT_TOKEN: ${{ secrets.SUPABASE_MGMT_TOKEN }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 验证环境变量
        run: |
          if [ -z "$SUPABASE_PAT" ] && [ -z "$SUPABASE_MGMT_TOKEN" ]; then
            echo "ERROR: SUPABASE_PAT / SUPABASE_MGMT_TOKEN 均未设置！请在 GitHub Secrets 中配置 SUPABASE_MGMT_TOKEN。"
            exit 1
          fi
          echo "凭据已配置: SUPABASE_PAT=${#SUPABASE_PAT} 字符, SUPABASE_MGMT_TOKEN=${#SUPABASE_MGMT_TOKEN} 字符"
          # 本流水线全部用标准库（urllib/subprocess），无需 pip install 第三方包。

      - name: 抓取原始数据（东财成分 + stock_scores 权/PE + gtimg 收盘）
        run: |
          LIMIT="${{ github.event.inputs.limit || '0' }}"
          INTERVAL="${{ github.event.inputs.interval || '0.35' }}"
          rm -f /tmp/WAF_BLOCKED.flag
          echo "全量抓取：limit=$LIMIT 间隔=${INTERVAL}s  开始 $(date '+%H:%M:%S')"
          python scripts/fetch_index_raw.py --limit "$LIMIT" --interval "$INTERVAL" || \
            echo "[WARN] fetch 有失败，继续 compute/promote（护栏会保旧数据）"
          echo "抓取结束 $(date '+%H:%M:%S')"

      - name: 步骤2 — 由原始数据算五维评分（写 staging）
        run: |
          echo "============================================"
          echo "  compute_index_scores（五维 + 分池标准化）"
          echo "  开始 $(date '+%Y-%m-%d %H:%M:%S')"
          echo "============================================"
          python scripts/compute_index_scores.py
          echo "计算完成 $(date '+%H:%M:%S')"

      - name: 步骤3 — 校验并原子切换到生产 index_scores
        run: |
          echo "============================================"
          echo "  promote_index_scores（护栏不过则拒绝切换）"
          echo "  开始 $(date '+%Y-%m-%d %H:%M:%S')"
          echo "============================================"
          python scripts/promote_index_scores.py
          echo "切换完成 $(date '+%H:%M:%S')"

      - name: 步骤4 — 确保 RPC 存在（精确计数用，CDN 对 Prefer 头会502）
        run: |
          # 幂等：DROP FUNCTION IF EXISTS 后重建，重复跑无副作用。
          python scripts/setup_index_rpc.py

      - name: 步骤5 — 输出本轮结果摘要
        if: always()
        run: |
          python - <<'PY'
          import os, sys, json, subprocess
          sql = """
          SELECT count(*) AS total, count(k_all) AS k_all_n,
                 count(pe_pct_5y) AS pe_n, count(DISTINCT pool) AS pools,
                 max(trade_date) AS trade_date,
                 count(*) FILTER (WHERE pool='broad')  AS broad_n,
                 count(*) FILTER (WHERE pool='sector') AS sector_n,
                 count(*) FILTER (WHERE pool='fixed')  AS fixed_n
          FROM index_scores
          """
          open('/tmp/_ci_sum.sql','w').write(sql)
          r = subprocess.run(['python3','scripts/_pgsql.py','--file','/tmp/_ci_sum.sql'],
                             capture_output=True, text=True)
          print("=== index_scores 生产表现状 ===")
          print(r.stdout.strip() or r.stderr.strip())
          PY

      - name: 步骤6 — 写入 ETL 运行日志（每日简报可见）
        if: always()
        run: |
          python3 - <<'PY'
          import os, subprocess, json, re
          from datetime import datetime, timezone, timedelta
          TZ = timezone(timedelta(hours=8))
          today = datetime.now(TZ).strftime('%Y-%m-%d')
          waf = os.path.exists('/tmp/WAF_BLOCKED.flag')
          d = ''
          try:
              open('/tmp/_ci_idx.sql','w').write(
                  "SELECT max(trade_date) AS d, count(*) AS n FROM index_scores")
              r = subprocess.run(['python3','scripts/_pgsql.py','--file','/tmp/_ci_idx.sql'],
                                 capture_output=True, text=True, timeout=130)
              out = (r.stdout or '').strip()
              try:
                  data = json.loads(out)
                  if isinstance(data, list) and data:
                      d = (data[0].get('d') or '')
                  elif isinstance(data, dict):
                      d = data.get('d') or ''
              except Exception:
                  m = re.search(r'\d{4}-\d{2}-\d{2}', out)
                  d = m.group(0) if m else ''
          except Exception as e:
              print('查询生产表失败:', e)
          if waf:
              status, msg = 'skipped', f'EastMoney 整体不可达（云IP偶发），生产表保持上一版本（最新 trade_date={d}）'
          elif d == today:
              status, msg = 'success', f'指数评分已刷新（trade_date={d}）'
          elif d:
              status, msg = 'skipped', f'本次未切换（生产最新 trade_date={d}，今日 {today}）；若连续多日未更新，请检查 EastMoney 可达性'
          else:
              status, msg = 'error', '生产表 index_scores 无数据'
          print('指数评分日志:', status, '|', msg)
          subprocess.run(['python3','scripts/log_etl_step.py','--step','指数评分 · 每日更新',
                          '--status',status,'--message',msg,'--run-date',today], check=False)
          PY

      - name: 抓取失败不阻断（限流/偶发不可达属常态）
        if: failure()
        run: |
          echo "::warning::指数评分流水线本次未全部成功（多半是数据源偶发不可达）。"
          echo "生产表保持上一次成功版本，不受影响；下次调度会自动重试。"
          exit 0
