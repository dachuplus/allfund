name: 投教内容聚合爬虫

on:
  # 独立 schedule 已停用（2026-11-28）：统一由调度中心 data-center-orchestrator.yml 串行调用。
  # schedule:
  #   - cron: '0 18 * * *'
  workflow_call:
    inputs:
      from_orchestrator:
        description: '仅由调度中心调用时置 true；手动/远程触发自动转交调度中心排队，本 workflow 不直接写生产'
        type: boolean
        default: false
      limit:
        description: '只爬前 N 家（调试用）'
        required: false
        type: string
        default: ''
      company:
        description: '只爬指定 domain（调试用）'
        required: false
        type: string
        default: ''
      skip_run:
        description: '调度中心日期门控用（本任务每日执行，恒为 false）'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      limit:
        description: '只爬前 N 家（调试用）'
        required: false
        default: ''
      company:
        description: '只爬指定 domain（调试用）'
        required: false
        default: ''

permissions:
  contents: read

env:
  SUPABASE_PAT: ${{ secrets.SUPABASE_MGMT_TOKEN }}
  SUPABASE_MGMT_TOKEN: ${{ secrets.SUPABASE_MGMT_TOKEN }}

jobs:
  # 手动/远程触发不直接写生产：自动转交调度中心，按 needs 优先次序排队执行。
  # 调度中心回调本 workflow 时 from_orchestrator=true，本 job 自动跳过，避免循环。
  delegate-to-orchestrator:
    if: ${{ !inputs.from_orchestrator }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 转交调度中心排队
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TASK: toujiao-crawl
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/data-center-orchestrator.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"only_task\":\"${TASK}\"}}")
          if [ "$status" != "204" ]; then echo "转交调度中心失败：HTTP $status"; exit 1; fi
          echo "已转交调度中心：only_task=${TASK}，将按 needs 优先次序排队执行（本 workflow 不直接写生产）"

  crawl:
    if: ${{ inputs.from_orchestrator }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖 + Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          python -m playwright install --with-deps chromium
      - name: 运行投教爬虫
        if: ${{ !inputs.skip_run }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ -n "${{ inputs.company }}" ]; then ARGS="$ARGS --company ${{ inputs.company }}"; fi
          python scripts/toujiao_crawler.py $ARGS
