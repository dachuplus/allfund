name: 投教内容聚合爬虫

on:
  schedule:
    # 北京 02:00 = UTC 18:00（夜间，避开交易时段，每日全量重抓一次）
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: '只爬前 N 家（调试用）'
        required: false
        default: ''
      company:
        description: '只爬指定 domain（调试用）'
        required: false
        default: ''

permissions:
  contents: read

env:
  SUPABASE_PAT: ${{ secrets.SUPABASE_MGMT_TOKEN }}
  SUPABASE_MGMT_TOKEN: ${{ secrets.SUPABASE_MGMT_TOKEN }}

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖 + Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          python -m playwright install --with-deps chromium
      - name: 运行投教爬虫
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"; fi
          if [ -n "${{ github.event.inputs.company }}" ]; then ARGS="$ARGS --company ${{ github.event.inputs.company }}"; fi
          python scripts/toujiao_crawler.py $ARGS
