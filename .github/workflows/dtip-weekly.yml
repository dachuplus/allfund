name: 定投助手每周一定投写入

# 定投助手 Part2：每周一（北京时间 09:00 = UTC 周一 01:00）自动按估值分位执行定投，
# 并将真实交易记录写入 public.dtip_auto_records（前端「自动定投记录」区块读取展示）。
# 写入走 Supabase Management API（_pgsql.pg），复用 SUPABASE_MGMT_TOKEN，无需新增密钥。
# 估值分位经同源边缘函数 /api/csi-pe 代取（规避 GitHub 云 IP 被 csindex WAF 403）。

on:
  # 独立 schedule 已停用（2026-11-28）：统一由调度中心 data-center-orchestrator.yml 串行调用，
  # 周一执行与否由调度中心的 monday-gate 判定。
  # schedule:
  #   - cron: '5 18 * * 1'
  workflow_call:
    inputs:
      from_orchestrator:
        description: '仅由调度中心调用时置 true；手动/远程触发自动转交调度中心排队，本 workflow 不直接写生产'
        type: boolean
        default: false
      skip_run:
        description: '非周一跳过真实写库（调度中心日期门控用）'
        type: boolean
        default: false
  # 手动触发（Actions 页面 Run workflow）
  workflow_dispatch:
  # 远程触发（无需登录 GitHub 点击）：
  #   POST /repos/dachuplus/allfund/dispatches  body {"event_type":"dtip-weekly"}
  repository_dispatch:
    types: [dtip-weekly]

permissions:
  contents: read

jobs:
  # 手动/远程触发不直接写生产：自动转交调度中心，按 needs 优先次序排队执行。
  # 调度中心回调本 workflow 时 from_orchestrator=true，本 job 自动跳过，避免循环。
  delegate-to-orchestrator:
    if: ${{ !inputs.from_orchestrator }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 转交调度中心排队
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TASK: dtip-weekly
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/data-center-orchestrator.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"only_task\":\"${TASK}\"}}")
          if [ "$status" != "204" ]; then echo "转交调度中心失败：HTTP $status"; exit 1; fi
          echo "已转交调度中心：only_task=${TASK}，将按 needs 优先次序排队执行（本 workflow 不直接写生产）"

  dtip-weekly:
    if: ${{ inputs.from_orchestrator }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI 仅配置 SUPABASE_MGMT_TOKEN；_pgsql.py 兼容 SUPABASE_PAT / SUPABASE_MGMT_TOKEN
      SUPABASE_PAT: ${{ secrets.SUPABASE_MGMT_TOKEN }}
      SUPABASE_MGMT_TOKEN: ${{ secrets.SUPABASE_MGMT_TOKEN }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 校验环境变量
        run: |
          if [ -z "$SUPABASE_PAT" ]; then
            echo "ERROR: 未配置 secrets.SUPABASE_MGMT_TOKEN"
            exit 1
          fi
          echo "SUPABASE_PAT 已配置: ${#SUPABASE_PAT} 字符"

      - name: 周一定投写入（估值分位 → 收盘 → 落库）
        if: ${{ !inputs.skip_run }}
        run: python scripts/dtip_weekly_commit.py
