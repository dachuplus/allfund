name: 定投助手每周一定投写入

# 定投助手 Part2：每周一（北京时间 09:00 = UTC 周一 01:00）自动按估值分位执行定投，
# 并将真实交易记录写入 public.dtip_auto_records（前端「自动定投记录」区块读取展示）。
# 写入走 Supabase Management API（_pgsql.pg），复用 SUPABASE_MGMT_TOKEN，无需新增密钥。
# 估值分位经同源边缘函数 /api/csi-pe 代取（规避 GitHub 云 IP 被 csindex WAF 403）。

on:
  # 定时触发：北京时间每周一 09:00（UTC 周一 01:00）
  schedule:
    - cron: '0 1 * * 1'
  # 手动触发（Actions 页面 Run workflow）
  workflow_dispatch:
  # 远程触发（无需登录 GitHub 点击）：
  #   POST /repos/dachuplus/allfund/dispatches  body {"event_type":"dtip-weekly"}
  repository_dispatch:
    types: [dtip-weekly]

permissions:
  contents: read

jobs:
  dtip-weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI 仅配置 SUPABASE_MGMT_TOKEN；_pgsql.py 兼容 SUPABASE_PAT / SUPABASE_MGMT_TOKEN
      SUPABASE_PAT: ${{ secrets.SUPABASE_MGMT_TOKEN }}
      SUPABASE_MGMT_TOKEN: ${{ secrets.SUPABASE_MGMT_TOKEN }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 校验环境变量
        run: |
          if [ -z "$SUPABASE_PAT" ]; then
            echo "ERROR: 未配置 secrets.SUPABASE_MGMT_TOKEN"
            exit 1
          fi
          echo "SUPABASE_PAT 已配置: ${#SUPABASE_PAT} 字符"

      - name: 周一定投写入（估值分位 → 收盘 → 落库）
        run: python scripts/dtip_weekly_commit.py
