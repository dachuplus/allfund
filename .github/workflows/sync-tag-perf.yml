name: 同步标签涨跌幅与资金流（fund_tag_perf）

on:
  # 手动触发
  workflow_dispatch:
  # 统一调度（2026-11-28）：独立 schedule 停用，改由 data-center-orchestrator.yml 串行触发。
  # workflow_call（供编排器复用；抓取→staging→校验→原子切换三段式）
  workflow_call:
    inputs:
      from_orchestrator:
        description: '仅由调度中心调用时置 true；手动/远程触发一律跳过写生产'
        type: boolean
        default: false
  # 原：每日北京时间 21:45（UTC 13:45）
  # schedule:
  #   - cron: '45 13 * * *'

env:
  PYTHONUNBUFFERED: '1'

jobs:
  sync-tag-perf:
    if: ${{ inputs.from_orchestrator }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_MGMT_TOKEN: ${{ secrets.SUPABASE_MGMT_TOKEN }}
      SUPABASE_PAT: ${{ secrets.SUPABASE_MGMT_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests psycopg2-binary

      - name: 同步标签涨跌幅 + 板块资金流（写入 fund_tag_perf）
        run: python scripts/sync_tag_performance.py
