name: AI大PK月度调仓

on:
  # 独立 schedule 已停用（2026-11-28）：统一由调度中心 data-center-orchestrator.yml 串行调用，
  # 每月 1 号执行与否由调度中心的 monthly-gate 判定。
  # schedule:
  #   - cron: '55 18 1 * *'
  workflow_call:
    inputs:
      from_orchestrator:
        description: '仅由调度中心调用时置 true；手动/远程触发自动转交调度中心排队，本 workflow 不直接写生产'
        type: boolean
        default: false
      period:
        description: '期次 YYYY-MM，默认当月'
        required: false
        type: string
        default: ''
      skip_run:
        description: '非每月 1 号跳过真实写库（调度中心日期门控用）'
        type: boolean
        default: false
  # 手动触发（测试 / 补跑用）
  workflow_dispatch:
    inputs:
      period:
        description: '期次 YYYY-MM，默认当月'
        required: false
        type: string
  # 远程触发（无需登录 GitHub 点击）：
  #   POST /repos/dachuplus/allfund/dispatches  body {"event_type":"ai-pk-run"}
  repository_dispatch:
    types: [ai-pk-run]

permissions:
  contents: read

jobs:
  # 手动/远程触发不直接写生产：自动转交调度中心，按 needs 优先次序排队执行。
  # 调度中心回调本 workflow 时 from_orchestrator=true，本 job 自动跳过，避免循环。
  delegate-to-orchestrator:
    if: ${{ !inputs.from_orchestrator }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 转交调度中心排队
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TASK: ai-pk-monthly
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/data-center-orchestrator.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"only_task\":\"${TASK}\"}}")
          if [ "$status" != "204" ]; then echo "转交调度中心失败：HTTP $status"; exit 1; fi
          echo "已转交调度中心：only_task=${TASK}，将按 needs 优先次序排队执行（本 workflow 不直接写生产）"

  rebalance:
    if: ${{ inputs.from_orchestrator }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
      ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      WENXIN_API_KEY: ${{ secrets.WENXIN_API_KEY }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 自愈模型 API 配置（对齐百炼路由与原生模型名）
        run: |
          pip install requests
          python3 scripts/sync_ai_pk_model_config.py

      - name: 运行 AI 大 PK 月度调仓
        if: ${{ !inputs.skip_run }}
        run: |
          if [ -n "${{ inputs.period }}" ]; then
            python3 scripts/ai_pk_real.py --period "${{ inputs.period }}"
          else
            python3 scripts/ai_pk_real.py
          fi
