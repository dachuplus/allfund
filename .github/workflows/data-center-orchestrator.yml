name: 调度中心 · 夜间数据统一调度

# =====================================================================
# 调度中心（2026-11-28 用户要求，统一命名「调度中心」）
#
# 痛点：此前各写库 workflow 各自带 schedule，时间散落在凌晨至上午，
# 任务耗时不可控，长任务尾部与后续任务重叠，多个 job 同时写 Supabase
# 免费实例 → PGRST002 / 57014 statement timeout / 整库卡死。
#
# 本调度中心是【唯一夜间数据入口】：
#   - 单一 cron 触发（北京时间 00:10），按 needs 链【严格串行】跑完所有写库任务；
#   - 上一个任务【完整结束】后才开始下一个，不依赖 cron 时间点错开；
#   - 【生产写入串行铁律】一个任务必须走完「抓取 → staging → 校验 → 写生产 →
#     后置刷新（物化视图/标签/元数据）」才算完成；下一个任务不得在它写生产期间启动，
#     也不得与它并发写任何生产表；
#   - 同一时刻只有一个任务写库，杜绝并发打满免费实例；
#   - 不设顶层 permissions / concurrency：实测这两者加在含 reusable workflow 的
#     caller 上会触发 startup_failure（0 job）；secrets 用 inherit 透传即可，
#     写库所需权限由各被调 workflow 自己的 GITHUB_TOKEN 默认权限承担。
#   - 每个被调 workflow 仍是独立文件、独立脚本，数据口径/抓取范围/校验逻辑完全不变；
#   - 所有被调 workflow 的独立 schedule 已停用；其 workflow_dispatch /
#     repository_dispatch 仍在，但子 workflow 全部以 inputs.from_orchestrator 门控，
#     【手动/远程触发不直接写生产】，而是自动转交本编排器（delegate-to-orchestrator
#     job 通过 GitHub API dispatch only_task=对应任务），由本编排器按 needs 优先次序
#     唯一排队写生产；
#   - 手动入口：本 workflow 的 workflow_dispatch(only_task) 默认 all 为整链，也可
#     只选一个任务，其余 job 按 needs 规则跳过但链不中断，仍严格串行；
#   - 【排队门】dispatch-queue-gate 等待所有更早的编排器 run 结束后才放行写库链，
#     保证多个手动请求同时到达时也不并发（用 run_id 大小判定先后，避免互等死锁）。
#
# 遵守抓数铁律：所有覆盖型写入均为「抓取→staging→校验→单事务切换生产」，
# 校验不过绝不碰生产表。收益/PE/定投记录类是 append-only 历史表（PK +
# ON CONFLICT 幂等、不覆盖生产），不造成服务挂起，纳入串行链但无需 staging。
#
# 日期门控（gate job 本身不写库、恒成功，只输出 run=true/false）：
#   - monday-gate      → dtip-weekly / stock-pk-weekly（仅北京时间周一执行）
#   - monthly-gate     → ai-pk-monthly（仅每月 1 号执行）
#   - quarterly-gate   → refresh-fund-scale-quarterly（仅 2/5/8/11 月 1 号执行）
#   - sunday-gate      → invest-style / movie-ratings-weekly（仅北京时间周日执行）
# 门控通过 with.skip_run 传给子 workflow：非执行日只跑 checkout/setup，
# 所有写库 step 被跳过，job 仍 success，串行链不会因 skipped 而中断。
#
# 不纳入本链（必须独立）：
#   - db-health-autoheal.yml：每 15min 探活自愈，守护任务不能排在被保护链里；
#   - etf-pcf-daily.yml：写 pcf-data 独立分支，不写 Supabase。
# =====================================================================

on:
  # 北京时间每天 00:10（UTC 16:10，次日凌晨）—— 用户要求全部安排在夜里 12 点后，
  # 夜间低负载时串行写库，进一步保护免费实例。
  schedule:
    - cron: '10 16 * * *'
  workflow_dispatch:
    inputs:
      only_task:
        description: '手动只跑某个任务（默认 all=按调度中心全链顺序执行）'
        type: choice
        default: all
        options:
          - all
          - fund-scores
          - tag-perf
          - stock-scores
          - style-factors
          - index-scores
          - ai-pk-returns
          - stock-pk-returns
          - dtip-pe-sync
          - fund-scale-growth
          - allocation-quarterly
          - tag-funds
          - tougu-daily
          - macro-history
          - monday-gate
          - dtip-weekly
          - stock-pk-weekly
          - monthly-gate
          - ai-pk-monthly
          - quarterly-gate
          - refresh-fund-scale-quarterly
          - news-spa-crawl
          - toujiao-crawl
          - sunday-gate
          - invest-style
          - movie-ratings-weekly

jobs:
  # ⓪ 排队门：等待更早的编排器 run 结束，确保同一时刻只有一个 run 进入写库链。
  # 用 run_id 大小判定先后（只等 id 更小的 run），多个并发 dispatch 不会互等死锁。
  dispatch-queue-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions:
      actions: read
    steps:
      - name: 等待更早的调度中心 run 完成
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          for i in $(seq 1 380); do
            earlier=0
            for st in queued in_progress; do
              n=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO}/actions/workflows/data-center-orchestrator.yml/runs?status=${st}&per_page=100" \
                | jq --argjson me "${RUN_ID}" '[.workflow_runs[]? | select(.id < $me)] | length' 2>/dev/null || echo 0)
              earlier=$((earlier + n))
            done
            if [ "$earlier" -eq 0 ]; then
              echo "排队门放行：无更早的调度中心 run（check $i）"
              exit 0
            fi
            echo "已有 ${earlier} 个更早的调度中心 run 未完成，排队等待（check $i）..."
            sleep 30
          done
          echo "等待超时：仍有更早的编排器 run，为避免并发写库本 run 不放行写库链"
          exit 1

  # ① 核心基金评分：产出 fund_scores + 物化视图，是下游多数任务的基线
  fund-scores:
    needs: [dispatch-queue-gate, dispatch-queue-gate]
    if: ${{ !cancelled() && needs['dispatch-queue-gate'].result == 'success' && (github.event.inputs.only_task == '' || github.event.inputs.only_task == 'all' || github.event.inputs.only_task == 'fund-scores') }}
    uses: ./.github/workflows/update-scores.yml
    with:
      from_orchestrator: true
    secrets: inherit

  # ② 热门标签资金流：抓取→staging→校验→原子切换（三段式改造）
  tag-perf:
    if: ${{ !cancelled() && needs['dispatch-queue-gate'].result == 'success' && needs['fund-scores'].result != 'failure' && needs['fund-scores'].result != 'cancelled' && (github.event.inputs.only_task == '' || github.event.inputs.only_task == 'all' || github.event.inputs.only_task == 'tag-perf') }}
    needs: [dispatch-queue-gate, fund-scores]
    uses: ./.github/workflows/sync-tag-perf.yml
    with:
      from_orchestrator: true
    secrets: inherit

  # ③ 股票全市场评分：staging→promote
  stock-scores:
    if: ${{ !cancelled() && needs['dispatch-queue-gate'].result == 'success' && needs['tag-perf'].result != 'failure' && needs['tag-perf'].result != 'cancelled' && (github.event.inputs.only_task == '' || github.event.inputs.only_task == 'all' || github.event.inputs.only_task == 'stock-scores') }}
    needs: [dispatch-queue-gate, tag-perf]
    uses: ./.github/workflows/update-stock-scores.yml
    with:
      from_orchestrator: true
    secrets: inherit

  # ④ 风格因子：抓取→staging→校验→原子切换（三段式改造）
  style-factors:
    if: ${{ !cancelled() && needs['dispatch-queue-gate'].result == 'success' && needs['stock-scores'].result != 'failure' && needs['stock-scores'].result != 'cancelled' && (github.event.inputs.only_task == '' || github.event.inputs.only_task == 'all' || github.event.inputs.only_task == 'style-factors') }}
    needs: [dispatch-queue-gate, stock-scores]
    uses: ./.github/workflows/update-style-factors.yml
    with:
      from_orchestrator: true
    secrets: inherit

  # ⑤ 指数评分：raw→staging→promote
  index-scores:
    if: ${{ !cancelled() && needs['dispatch-queue-gate'].result == 'success' && needs['style-factors'].result != 'failure' && needs['style-factors'].result != 'cancelled' && (github.event.inputs.only_task == '' || github.event.inputs.only_task == 'all' || github.event.inputs.only_task == 'index-scores') }}
    needs: [dispatch-queue-gate, style-factors]
    uses: ./.github/workflows/update-index-scores.yml
    with:
      from_orchestrator: true
    secrets: inherit

  # ⑥ 基金组合月度收益（append-only 历史记录，幂等）
  ai-pk-returns:
    if: ${{ !cancelled() && needs['dispatch-queue-gate'].result == 'success' && needs['index-scores'].result != 'failure' && needs['index-scores'].result != 'cancelled' && (github.event.inputs.only_task == '' || github.event.inputs.only_task == 'all' || github.event.inputs.only_task == 'ai-pk-returns') }}
    needs: [dispatch-queue-gate, index-scores]
    uses: ./.github/workflows/ai-pk-monthly-returns.yml
    with:
      from_orchestrator: true
    secrets: inherit

  # ⑦ 股票组合周度收益（append-only 历史记录，幂等）
  stock-pk-returns:
    if: ${{ !cancelled() && needs['dispatch-queue-gate'].result == 'success' && needs['ai-pk-returns'].result != 'failure' && needs['ai-pk-returns'].result != 'cancelled' && (github.event.inputs.only_task == '' || github.event.inputs.only_task == 'all' || github.event.inputs.only_task == 'stock-pk-returns') }}
    needs: [dispatch-queue-gate, ai-pk-returns]
    uses: ./.github/workflows/stock-pk-monthly-returns.yml
    with:
      from_orchestrator: true
    secrets: inherit

  # ⑧ 定投 PE 历史缓存（增量 append，ON CONFLICT DO NOTHING 幂等）
  dtip-pe-sync:
    if: ${{ !cancelled() && needs['dispatch-queue-gate'].result == 'success' && needs['stock-pk-returns'].result != 'failure' && needs['stock-pk-returns'].result != 'cancelled' && (github.event.inputs.only_task == '' || github.event.inputs.only_task == 'all' || github.event.inputs.only_task == 'dtip-pe-sync') }}
    needs: [dispatch-queue-gate, stock-pk-returns]
    uses: ./.github/workflows/dtip-pe-sync.yml
    with:
      from_orchestrator: true
    secrets: inherit

  # ⑨ 基金规模增长：staging→校验→promote+刷视图
  fund-scale-growth:
    if: ${{ !cancelled() && needs['dispatch-queue-gate'].result == 'success' && needs['dtip-pe-sync'].result != 'failure' && needs['dtip-pe-sync'].result != 'cancelled' && (github.event.inputs.only_task == '' || github.event.inputs.only_task == 'all' || github.event.inputs.only_task == 'fund-scale-growth') }}
    needs: [dispatch-queue-gate, dtip-pe-sync]
    uses: ./.github/workflows/fund-scale-growth-nightly.yml
    with:
      from_orchestrator: true
    secrets: inherit

  # ⑩ 资产配置/季度评分（最重，8+8 分片已限 max-parallel:2）+ 刷视图
  allocation-quarterly:
    if: ${{ !cancelled() && needs['dispatch-queue-gate'].result == 'success' && needs['fund-scale-growth'].result != 'failure' && needs['fund-scale-growth'].result != 'cancelled' && (github.event.inputs.only_task == '' || github.event.inputs.only_task == 'all' || github.event.inputs.only_task == 'allocation-quarterly') }}
    needs: [dispatch-queue-gate, fund-scale-growth]
    uses: ./.github/workflows/update-allocation-quarterly.yml
    with:
      from_orchestrator: true
    secrets: inherit

  # ⑪ 标签-基金映射：staging→校验→单事务落地（与 promote 共用 advisory lock）
  tag-funds:
    if: ${{ !cancelled() && needs['dispatch-queue-gate'].result == 'success' && needs['allocation-quarterly'].result != 'failure' && needs['allocation-quarterly'].result != 'cancelled' && (github.event.inputs.only_task == '' || github.event.inputs.only_task == 'all' || github.event.inputs.only_task == 'tag-funds') }}
    needs: [dispatch-queue-gate, allocation-quarterly]
    uses: ./.github/workflows/tag-funds-daily.yml
    with:
      from_orchestrator: true
    secrets: inherit

  # ⑫ 投顾产品每日更新（原独立 01:17）
  tougu-daily:
    if: ${{ !cancelled() && needs['dispatch-queue-gate'].result == 'success' && needs['tag-funds'].result != 'failure' && needs['tag-funds'].result != 'cancelled' && (github.event.inputs.only_task == '' || github.event.inputs.only_task == 'all' || github.event.inputs.only_task == 'tougu-daily') }}
    needs: [dispatch-queue-gate, tag-funds]
    uses: ./.github/workflows/tougu-daily.yml
    with:
      from_orchestrator: true
    secrets: inherit

  # ⑬ 宏观历史日更（原独立 01:40）：staging→校验→promote
  macro-history:
    if: ${{ !cancelled() && needs['dispatch-queue-gate'].result == 'success' && needs['tougu-daily'].result != 'failure' && needs['tougu-daily'].result != 'cancelled' && (github.event.inputs.only_task == '' || github.event.inputs.only_task == 'all' || github.event.inputs.only_task == 'macro-history') }}
    needs: [dispatch-queue-gate, tougu-daily]
    uses: ./.github/workflows/macro-history-daily.yml
    with:
      from_orchestrator: true
    secrets: inherit

  # ── 日期门控：北京时间周一 ──────────────────────────────────────────
  monday-gate:
    needs: [dispatch-queue-gate, macro-history]
    if: ${{ !cancelled() && needs['dispatch-queue-gate'].result == 'success' && needs['macro-history'].result != 'failure' && needs['macro-history'].result != 'cancelled' && (github.event.inputs.only_task == '' || github.event.inputs.only_task == 'all' || github.event.inputs.only_task == 'monday-gate') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          DOW=$(TZ=Asia/Shanghai date +%u)
          if [ "$DOW" = "1" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "北京时间周一：执行本周定投/股票PK任务"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "北京时间非周一（dow=$DOW）：跳过本周定投/股票PK任务"
          fi

  # ⑭ 定投助手周投记录（原独立周一 02:05）：仅周一写库
  dtip-weekly:
    needs: [dispatch-queue-gate, monday-gate]
    if: ${{ !cancelled() && needs['dispatch-queue-gate'].result == 'success' && needs['monday-gate'].result != 'failure' && needs['monday-gate'].result != 'cancelled' && (github.event.inputs.only_task == '' || github.event.inputs.only_task == 'all' || github.event.inputs.only_task == 'dtip-weekly') }}
    uses: ./.github/workflows/dtip-weekly.yml
    with:
      from_orchestrator: true
      skip_run: ${{ needs['monday-gate'].outputs.run == 'false' }}
    secrets: inherit

  # ⑮ 股票 PK 每周重选（原独立周一 02:30）：仅周一写库
  stock-pk-weekly:
    needs: [dispatch-queue-gate, dtip-weekly, monday-gate]
    if: ${{ !cancelled() && needs['dispatch-queue-gate'].result == 'success' && needs['dtip-weekly'].result != 'failure' && needs['dtip-weekly'].result != 'cancelled' && needs['monday-gate'].result != 'failure' && needs['monday-gate'].result != 'cancelled' && (github.event.inputs.only_task == '' || github.event.inputs.only_task == 'all' || github.event.inputs.only_task == 'stock-pk-weekly') }}
    uses: ./.github/workflows/stock-pk-weekly.yml
    with:
      from_orchestrator: true
      skip_run: ${{ needs['monday-gate'].outputs.run == 'false' }}
    secrets: inherit

  # ── 日期门控：北京时间每月 1 号 ─────────────────────────────────────
  monthly-gate:
    needs: [dispatch-queue-gate, stock-pk-weekly]
    if: ${{ !cancelled() && needs['dispatch-queue-gate'].result == 'success' && needs['stock-pk-weekly'].result != 'failure' && needs['stock-pk-weekly'].result != 'cancelled' && (github.event.inputs.only_task == '' || github.event.inputs.only_task == 'all' || github.event.inputs.only_task == 'monthly-gate') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          DAY=$(TZ=Asia/Shanghai date +%d)
          if [ "$DAY" = "01" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "北京时间每月 1 号：执行基金 AI 大 PK 月度调仓"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "北京时间非月初（day=$DAY）：跳过基金 AI 大 PK 月度调仓"
          fi

  # ⑯ 基金 AI 大 PK 月度调仓（原独立每月 1 号 02:55）：仅月初写库
  ai-pk-monthly:
    needs: [dispatch-queue-gate, monthly-gate]
    if: ${{ !cancelled() && needs['dispatch-queue-gate'].result == 'success' && needs['monthly-gate'].result != 'failure' && needs['monthly-gate'].result != 'cancelled' && (github.event.inputs.only_task == '' || github.event.inputs.only_task == 'all' || github.event.inputs.only_task == 'ai-pk-monthly') }}
    uses: ./.github/workflows/ai-pk-monthly.yml
    with:
      from_orchestrator: true
      skip_run: ${{ needs['monthly-gate'].outputs.run == 'false' }}
    secrets: inherit

  # ── 日期门控：北京时间 2/5/8/11 月 1 号 ─────────────────────────────
  quarterly-gate:
    needs: [dispatch-queue-gate, ai-pk-monthly]
    if: ${{ !cancelled() && needs['dispatch-queue-gate'].result == 'success' && needs['ai-pk-monthly'].result != 'failure' && needs['ai-pk-monthly'].result != 'cancelled' && (github.event.inputs.only_task == '' || github.event.inputs.only_task == 'all' || github.event.inputs.only_task == 'quarterly-gate') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          DAY=$(TZ=Asia/Shanghai date +%d)
          MON=$(TZ=Asia/Shanghai date +%m)
          case "$MON" in
            02|05|08|11) IS_Q=1 ;;
            *) IS_Q=0 ;;
          esac
          if [ "$DAY" = "01" ] && [ "$IS_Q" = "1" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "北京时间季初 ${MON}-${DAY}：执行基金规模季度回刷"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "北京时间非季初（${MON}-${DAY}）：跳过基金规模季度回刷"
          fi

  # ⑰ 基金规模季度回刷（原独立季初 03:20）：仅季初写库
  refresh-fund-scale-quarterly:
    needs: [dispatch-queue-gate, quarterly-gate]
    if: ${{ !cancelled() && needs['dispatch-queue-gate'].result == 'success' && needs['quarterly-gate'].result != 'failure' && needs['quarterly-gate'].result != 'cancelled' && (github.event.inputs.only_task == '' || github.event.inputs.only_task == 'all' || github.event.inputs.only_task == 'refresh-fund-scale-quarterly') }}
    uses: ./.github/workflows/refresh-fund-scale-quarterly.yml
    with:
      from_orchestrator: true
      skip_run: ${{ needs['quarterly-gate'].outputs.run == 'false' }}
    secrets: inherit

  # ⑱ 资讯 SPA 聚合爬虫（原独立 03:30）
  news-spa-crawl:
    needs: [dispatch-queue-gate, refresh-fund-scale-quarterly]
    if: ${{ !cancelled() && needs['dispatch-queue-gate'].result == 'success' && needs['refresh-fund-scale-quarterly'].result != 'failure' && needs['refresh-fund-scale-quarterly'].result != 'cancelled' && (github.event.inputs.only_task == '' || github.event.inputs.only_task == 'all' || github.event.inputs.only_task == 'news-spa-crawl') }}
    uses: ./.github/workflows/news-spa-crawl.yml
    with:
      from_orchestrator: true
    secrets: inherit

  # ⑲ 投教内容聚合爬虫（原独立 02:00）
  toujiao-crawl:
    needs: [dispatch-queue-gate, news-spa-crawl]
    if: ${{ !cancelled() && needs['dispatch-queue-gate'].result == 'success' && needs['news-spa-crawl'].result != 'failure' && needs['news-spa-crawl'].result != 'cancelled' && (github.event.inputs.only_task == '' || github.event.inputs.only_task == 'all' || github.event.inputs.only_task == 'toujiao-crawl') }}
    uses: ./.github/workflows/toujiao-crawl.yml
    with:
      from_orchestrator: true
    secrets: inherit

  # ── 日期门控：北京时间周日 ──────────────────────────────────────────
  sunday-gate:
    needs: [dispatch-queue-gate, toujiao-crawl]
    if: ${{ !cancelled() && needs['dispatch-queue-gate'].result == 'success' && needs['toujiao-crawl'].result != 'failure' && needs['toujiao-crawl'].result != 'cancelled' && (github.event.inputs.only_task == '' || github.event.inputs.only_task == 'all' || github.event.inputs.only_task == 'sunday-gate') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          DOW=$(TZ=Asia/Shanghai date +%u)
          if [ "$DOW" = "7" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "北京时间周日：执行投资风格 / 电影评分周更"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "北京时间非周日（dow=$DOW）：跳过投资风格 / 电影评分周更"
          fi

  # ⑳ 基金投资风格周更（原独立周日 03:00）：仅周日写库
  invest-style:
    needs: [dispatch-queue-gate, sunday-gate]
    if: ${{ !cancelled() && needs['dispatch-queue-gate'].result == 'success' && needs['sunday-gate'].result != 'failure' && needs['sunday-gate'].result != 'cancelled' && (github.event.inputs.only_task == '' || github.event.inputs.only_task == 'all' || github.event.inputs.only_task == 'invest-style') }}
    uses: ./.github/workflows/invest-style.yml
    with:
      from_orchestrator: true
      skip_run: ${{ needs['sunday-gate'].outputs.run == 'false' }}
    secrets: inherit

  # ㉑ 电影评分周更（原独立周日 04:00）：仅周日写库
  movie-ratings-weekly:
    needs: [dispatch-queue-gate, invest-style, sunday-gate]
    if: ${{ !cancelled() && needs['dispatch-queue-gate'].result == 'success' && needs['invest-style'].result != 'failure' && needs['invest-style'].result != 'cancelled' && needs['sunday-gate'].result != 'failure' && needs['sunday-gate'].result != 'cancelled' && (github.event.inputs.only_task == '' || github.event.inputs.only_task == 'all' || github.event.inputs.only_task == 'movie-ratings-weekly') }}
    uses: ./.github/workflows/movie-ratings-weekly.yml
    with:
      from_orchestrator: true
      skip_run: ${{ needs['sunday-gate'].outputs.run == 'false' }}
    secrets: inherit
