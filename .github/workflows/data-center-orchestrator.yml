name: 数据中心 · 夜间数据统一调度

# =====================================================================
# 数据中心统一调度（2026-11-28 用户要求）
#
# 痛点：此前 11 个写库 workflow 各自带 schedule，时间散落在 21:30~05:00，
# 且部分长流水线尾部重叠，多个 job 同时写 Supabase 免费实例 → PGRST002 / 整库卡死。
#
# 本编排器是【唯一夜间数据入口】：
#   - 单一 cron 触发，按 needs 链【严格串行】跑完 11 个写库任务；
#   - 同一时刻只有一个任务写库，杜绝并发打满免费实例；
#   - 每个被调 workflow 仍是独立文件、独立脚本，数据口径/抓取范围/校验逻辑完全不变；
#   - 各子 workflow 的独立 schedule 已停用（保留 workflow_dispatch 供手动排障），
#     避免双重触发。
#
# 遵守抓数铁律：所有覆盖型写入均为「抓取→staging→校验→单事务切换生产」，
# 校验不过绝不碰生产表。收益/PE 记录类是 append-only 历史表（PK + ON CONFLICT
# 幂等、不覆盖生产），不造成服务挂起，纳入串行链但无需 staging。
#
# 不纳入本链（必须独立）：
#   - db-health-autoheal.yml：每 15min 探活自愈，守护任务不能排在被保护链里；
#   - etf-pcf-daily.yml：写 pcf-data 独立分支，不写 Supabase；
#   - 周/月/季更低频任务（invest-style/movie-ratings/ai-pk-monthly/
#     stock-pk-weekly/refresh-fund-scale-quarterly/dtip-weekly）+ 白天任务
#     （macro-history 10:00 / tougu 09:00 / toujiao 02:00 低频）：频率低、时间分散，
#     不参与每日高峰，保留各自独立调度。
# =====================================================================

on:
  # 北京时间每天 21:10（UTC 13:10）—— 早于原 21:30 核心评分，作为统一入口。
  schedule:
    - cron: '10 13 * * *'
  workflow_dispatch:

concurrency:
  group: data-center-orchestrator
  cancel-in-progress: false   # 不中途取消正在写的任务，防止写一半

permissions:
  contents: write
  actions: write

jobs:
  # ① 核心基金评分：产出 fund_scores + 物化视图，是下游多数任务的基线
  fund-scores:
    uses: ./.github/workflows/update-scores.yml
    secrets: inherit

  # ② 热门标签资金流：抓取→staging→校验→原子切换（本次三段式改造）
  tag-perf:
    needs: [fund-scores]
    uses: ./.github/workflows/sync-tag-perf.yml
    secrets: inherit

