name: 每周更新基金投资风格

# 独立流水线：只负责 fund_scores 的 invest_style / style_period 两列。
# 风格是季度披露数据，不适合塞进每日评分流水线（update-scores.yml），
# 也不修改其任何步骤；抓取失败不影响评分更新。
#
# 抓取结束后脚本会自行 REFRESH MATERIALIZED VIEW fund_scores_main，
# 默认「主代码」列表与「筛选结果」总数随之同步。
#
# 调度：UTC 周日 19:00 = 北京时间周一 03:00（每日评分流水线 21:30 之后）。

on:
  schedule:
    - cron: '0 19 * * 0'
  workflow_dispatch:
    inputs:
      limit:
        description: '只处理前 N 只（0 = 全量），调试用'
        required: false
        type: string
        default: '0'
      workers:
        description: '并发数（>5 会被限流，默认 3）'
        required: false
        type: string
        default: '3'
      only_missing:
        description: '只抓尚无风格的基金（续跑用）'
        required: false
        type: boolean
        default: false

env:
  PYTHONUNBUFFERED: '1'

permissions:
  contents: read

jobs:
  invest-style:
    runs-on: ubuntu-latest
    # 全量约 2.8 万只页面、并发 3，实测约 80~100 分钟，给足余量
    timeout-minutes: 240
    env:
      SUPABASE_MGMT_TOKEN: ${{ secrets.SUPABASE_MGMT_TOKEN }}
      SUPABASE_PAT: ${{ secrets.SUPABASE_MGMT_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 幂等准备列与物化视图
        run: python scripts/ensure_invest_style_columns.py

      - name: 抓取最新报告期投资风格
        run: |
          EXTRA=""
          if [ "${{ inputs.only_missing }}" = "true" ]; then EXTRA="--only-missing"; fi
          python scripts/fetch_invest_style.py \
            --workers "${{ inputs.workers || '3' }}" \
            --limit "${{ inputs.limit || '0' }}" \
            $EXTRA
