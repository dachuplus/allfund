name: 每周更新基金投资风格

# 独立流水线：只负责 fund_scores 的 invest_style / style_period 两列。
# 风格是季度披露数据，不适合塞进每日评分流水线（update-scores.yml），
# 也不修改其任何步骤；抓取失败不影响评分更新。
#
# 2026-11-14 起脚本改为「按批抓取、抓完即写库」：每 400 只立刻
# UPDATE fund_scores 并写进度表 public.fund_style_fetch，中途取消/超时
# 也保留已完成批次；用 resume=true 可跳过已抓代码接着跑。
# 每 8 批及结束时 REFRESH MATERIALIZED VIEW fund_scores_main，
# 默认「主代码」列表与「筛选结果」总数随之同步。
#
# 调度：UTC 周日 19:00 = 北京时间周一 03:00（每日评分流水线 21:30 之后）。
# 每周全量重新核对全部基金，才能抓到新报告期；不带 resume 时会先清空进度表。

on:
  schedule:
    - cron: '0 19 * * 0'
  workflow_dispatch:
    inputs:
      limit:
        description: '只处理前 N 只（0 = 全量），调试用'
        required: false
        type: string
        default: '0'
      workers:
        description: '并发数（实测 >8 会被限流，默认 8）'
        required: false
        type: string
        default: '8'
      chunk:
        description: '每批只数，抓完立即写库'
        required: false
        type: string
        default: '400'
      resume:
        description: '断点续跑：不清空进度表，跳过已抓代码'
        required: false
        type: boolean
        default: false
      only_missing:
        description: '只抓尚无风格的基金（轻量补漏用）'
        required: false
        type: boolean
        default: false

env:
  PYTHONUNBUFFERED: '1'

permissions:
  contents: read

jobs:
  invest-style:
    runs-on: ubuntu-latest
    # 全量约 2.8 万只页面、并发 8，实测约 50~70 分钟，给足余量
    timeout-minutes: 240
    env:
      SUPABASE_MGMT_TOKEN: ${{ secrets.SUPABASE_MGMT_TOKEN }}
      SUPABASE_PAT: ${{ secrets.SUPABASE_MGMT_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 幂等准备列与物化视图
        run: python scripts/ensure_invest_style_columns.py

      - name: 抓取最新报告期投资风格
        run: |
          EXTRA=""
          if [ "${{ inputs.resume }}" = "true" ]; then EXTRA="$EXTRA --resume"; fi
          if [ "${{ inputs.only_missing }}" = "true" ]; then EXTRA="$EXTRA --only-missing"; fi
          python scripts/fetch_invest_style.py \
            --workers "${{ inputs.workers || '8' }}" \
            --chunk "${{ inputs.chunk || '400' }}" \
            --limit "${{ inputs.limit || '0' }}" \
            $EXTRA
