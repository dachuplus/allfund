name: 基金组合月度收益记录

on:
  # 定时触发：北京时间每日 01:10（UTC 17:10）—— 减负 B2 错峰（2026-11-27）
  # 原 23:40 处于 23:20-23:50 密集簇，与股票评分/规模增长/物化视图刷新并发。
  # 需晚于 update-scores（21:30）确保近1月收益已刷新，01:10 满足且避开高峰。
  # 统一调度（2026-11-28）：独立 schedule 停用，改由 data-center-orchestrator.yml 串行触发。
  # schedule:
  #   - cron: '10 17 * * *'   # 原北京时间每日 01:10
  workflow_call:
    inputs:
      from_orchestrator:
        description: '仅由调度中心调用时置 true；手动/远程触发自动转交调度中心排队，本 workflow 不直接写生产'
        type: boolean
        default: false
  # 手动触发
  workflow_dispatch:
  # 远程触发（无需登录 GitHub 点击）：
  #   POST /repos/dachuplus/allfund/dispatches  body {"event_type":"ai-pk-returns-run"}
  repository_dispatch:
    types: [ai-pk-returns-run]

env:
  PYTHONUNBUFFERED: '1'

jobs:
  # 手动/远程触发不直接写生产：自动转交调度中心，按 needs 优先次序排队执行。
  # 调度中心回调本 workflow 时 from_orchestrator=true，本 job 自动跳过，避免循环。
  delegate-to-orchestrator:
    if: ${{ !inputs.from_orchestrator }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 转交调度中心排队
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TASK: ai-pk-returns
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/data-center-orchestrator.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"only_task\":\"${TASK}\"}}")
          if [ "$status" != "204" ]; then echo "转交调度中心失败：HTTP $status"; exit 1; fi
          echo "已转交调度中心：only_task=${TASK}，将按 needs 优先次序排队执行（本 workflow 不直接写生产）"

  ai-pk-returns:
    if: ${{ inputs.from_orchestrator }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI 仅配置 SUPABASE_MGMT_TOKEN；脚本兼容 SUPABASE_PAT 或 SUPABASE_MGMT_TOKEN
      SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
      SUPABASE_MGMT_TOKEN: ${{ secrets.SUPABASE_MGMT_TOKEN }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 记录各模型月度组合收益
        run: |
          echo "============================================"
          echo "  record_ai_pk_monthly_returns"
          echo "  开始时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "============================================"
          python scripts/record_ai_pk_monthly_returns.py
          echo "完成时间: $(date '+%Y-%m-%d %H:%M:%S')"
