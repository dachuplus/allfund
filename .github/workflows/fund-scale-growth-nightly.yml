name: 基金规模增长夜间更新

on:
  schedule:
    # 北京时间每天 02:40（UTC 18:40）—— 减负 B2 错峰（2026-11-27）
    # 原 23:30 与 update-scores（21:30 长流水线，尾部可能拖到 23:30+）并发刷新
    # 同一物化视图 fund_scores_main，互相阻塞并打满免费实例。移到凌晨空闲段，
    # 远离 23:20 股票评分 / 23:40-23:50 收益记录簇 / 00:10 风格 / 00:40 指数。
    # 本任务只需晚于 21:30 评分（提供 fund_scores），02:40 完全满足，数据口径不变。
    - cron: '40 18 * * *'
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: '跳过抓取，仅清洗/校验并 promote 已有 staging'
        type: boolean
        default: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_PAT: ${{ secrets.SUPABASE_MGMT_TOKEN }}
      SUPABASE_MGMT_TOKEN: ${{ secrets.SUPABASE_MGMT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check credentials
        run: |
          if [ -z "$SUPABASE_MGMT_TOKEN" ]; then
            echo "ERROR: SUPABASE_MGMT_TOKEN 未配置"
            exit 1
          fi
          echo "SUPABASE_MGMT_TOKEN 已配置: ${#SUPABASE_MGMT_TOKEN} 字符"

      - name: Step 1 - Fetch into staging table
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_fetch }}
        run: |
          python3 scripts/refresh_fund_scale_growth.py \
            --to-staging \
            --workers 8 \
            --delay 0.12

      - name: Step 2 - Validate and promote to production
        run: |
          python3 scripts/refresh_fund_scale_growth.py --promote
