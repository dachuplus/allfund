name: 基金规模增长夜间更新

on:
  # 统一调度（2026-11-28）：独立 schedule 停用，改由 data-center-orchestrator.yml 串行触发。
  # 原 02:40 为减负 B2 错峰时段，本任务需晚于核心评分（提供 fund_scores），数据口径不变。
  # schedule:
  #   - cron: '40 18 * * *'
  workflow_call:
    inputs:
      from_orchestrator:
        description: '仅由调度中心调用时置 true；手动/远程触发一律跳过写生产'
        type: boolean
        default: false
      skip_fetch:
        description: '跳过抓取，仅清洗/校验并 promote 已有 staging'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: '跳过抓取，仅清洗/校验并 promote 已有 staging'
        type: boolean
        default: false

jobs:
  refresh:
    if: ${{ inputs.from_orchestrator }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_PAT: ${{ secrets.SUPABASE_MGMT_TOKEN }}
      SUPABASE_MGMT_TOKEN: ${{ secrets.SUPABASE_MGMT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check credentials
        run: |
          if [ -z "$SUPABASE_MGMT_TOKEN" ]; then
            echo "ERROR: SUPABASE_MGMT_TOKEN 未配置"
            exit 1
          fi
          echo "SUPABASE_MGMT_TOKEN 已配置: ${#SUPABASE_MGMT_TOKEN} 字符"

      - name: Step 1 - Fetch into staging table
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_fetch }}
        run: |
          python3 scripts/refresh_fund_scale_growth.py \
            --to-staging \
            --workers 8 \
            --delay 0.12

      - name: Step 2 - Validate and promote to production
        run: |
          python3 scripts/refresh_fund_scale_growth.py --promote
