name: 资讯SPA聚合爬虫

on:
  # 独立 schedule 已停用（2026-11-28）：统一由调度中心 data-center-orchestrator.yml 串行调用。
  # schedule:
  #   - cron: '30 19 * * *'
  workflow_call:
    inputs:
      from_orchestrator:
        description: '仅由调度中心调用时置 true；手动/远程触发一律跳过写生产'
        type: boolean
        default: false
      source:
        description: '只爬指定 source_key（默认全部）'
        required: false
        type: string
        default: ''
      skip_run:
        description: '调度中心日期门控用（本任务每日执行，恒为 false）'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      source:
        description: '只爬指定 source_key（默认全部）'
        required: false
        default: ''

jobs:
  crawl:
    if: ${{ inputs.from_orchestrator }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright + deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run news SPA crawler
        if: ${{ !inputs.skip_run }}
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_MGMT_TOKEN }}
          SUPABASE_MGMT_TOKEN: ${{ secrets.SUPABASE_MGMT_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.source }}" ]; then
            ARGS="--source ${{ inputs.source }}"
          fi
          python3 scripts/news_spa_crawler.py $ARGS
