name: 股票全市场评分每日更新

# 沪深京 A 股 + 港股全市场「靠谱成长指数 v1」每日刷新。
# 与 update-scores.yml（基金，北京 21:30）、update-allocation-quarterly.yml（22:30）错峰，
# 放在北京 23:20（UTC 15:20），避免同抢 Supabase 连接与东财接口配额。
#
# 安全性：脚本只写 stock_scores_staging；本 workflow 第二步 promote_stock_scores.py 会做
# （总量 >=5000 / 港股 >=800 / k_all 非空率 >=60% / 基本面覆盖率）校验，
# 任一不通过即拒绝切换，生产表保持不变 —— 抓取失败不会污染线上。

on:
  # 统一调度（2026-11-28）：独立 schedule 停用，改由 data-center-orchestrator.yml 串行触发。
  # schedule:
  #   - cron: '20 15 * * *'   # 原北京时间每日 23:20
  workflow_call:
    inputs:
      from_orchestrator:
        description: '仅由调度中心调用时置 true；手动/远程触发自动转交调度中心排队，本 workflow 不直接写生产'
        type: boolean
        default: false
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: '1'

jobs:
  # 手动/远程触发不直接写生产：自动转交调度中心，按 needs 优先次序排队执行。
  # 调度中心回调本 workflow 时 from_orchestrator=true，本 job 自动跳过，避免循环。
  delegate-to-orchestrator:
    if: ${{ !inputs.from_orchestrator }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 转交调度中心排队
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TASK: stock-scores
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/data-center-orchestrator.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"only_task\":\"${TASK}\"}}")
          if [ "$status" != "204" ]; then echo "转交调度中心失败：HTTP $status"; exit 1; fi
          echo "已转交调度中心：only_task=${TASK}，将按 needs 优先次序排队执行（本 workflow 不直接写生产）"

  update-stock-scores:
    if: ${{ inputs.from_orchestrator }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 验证环境变量
        run: |
          if [ -z "$SUPABASE_PAT" ]; then
            echo "ERROR: SUPABASE_PAT 未设置！请在 GitHub Secrets 中配置。"
            exit 1
          fi
          echo "SUPABASE_PAT 已配置: ${#SUPABASE_PAT} 字符"

      - name: 步骤1 — 抓取全市场行情 + 财务并计算五维评分（写 stock_scores_staging）
        run: |
          echo "============================================"
          echo "  步骤1: fetch_stock_scores（沪深京 A 股 + 港股全市场）"
          echo "  开始时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "============================================"
          pip install requests
          python scripts/fetch_stock_scores.py --dump /tmp/stock_rows.json
          echo "抓取完成: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: 步骤2 — 校验并原子切换到生产 stock_scores
        run: |
          echo "============================================"
          echo "  步骤2: promote_stock_scores"
          echo "  开始时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "============================================"
          pip install requests
          # 若步骤1 写库曾因网络抖动丢批，先用转储回灌一次再校验切换
          if [ -f /tmp/stock_rows.json ]; then
            python scripts/fetch_stock_scores.py --from-dump /tmp/stock_rows.json || echo "[WARN] 回灌跳过"
          fi
          python scripts/promote_stock_scores.py
          echo "切换完成: $(date '+%Y-%m-%d %H:%M:%S')"
